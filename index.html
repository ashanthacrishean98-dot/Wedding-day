<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homecoming Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Libre+Baskerville&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: "Libre Baskerville", serif;
    color: #e6c77b;

    /* BLACK & GOLD BACKGROUND */
    background: 
        linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.95)),
        url('https://www.transparenttextures.com/patterns/black-linen.png');
}

/* COVER */
.cover {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 10;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.cover-text {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #e6c77b;
    font-size: 14px;
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border-radius: 25px;
}

/* MAIN CONTENT */
.container {
    max-width: 600px;
    margin: auto;
    padding: 50px 20px;
    text-align: center;
}

/* TEXT */
.names {
    font-family: "Playfair Display", serif;
    font-size: 32px;
    color: #f5d27a;
    margin: 20px 0;
}

h2 {
    font-family: "Playfair Display", serif;
    color: #f5d27a;
    font-weight: 500;
    margin-top: 35px;
    margin-bottom: 10px;
}

p {
    font-size: 15px;
    line-height: 1.8;
    margin: 10px 0;
}

/* DIVIDER */
.divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(to right, transparent, #f5d27a, transparent);
    margin: 25px auto;
}

/* MAP */
iframe {
    width: 100%;
    height: 260px;
    margin-top: 15px;
    border: 0;
}

/* LINK */
a {
    color: #f5d27a;
    text-decoration: none;
    border-bottom: 1px solid #f5d27a;
}

/* MOBILE */
@media (max-width: 600px) {
    .names {
        font-size: 26px;
    }

    h2 {
        font-size: 18px;
    }

    p {
        font-size: 14px;
    }

    .container {
        padding: 40px 15px;
    }
}

/* SCROLL ANIMATION (UPWARD + FADE) */
.fade {
    opacity: 0;
    transform: translateY(40px);
    transition: all 1.2s ease;
}

.show {
    opacity: 1;
    transform: translateY(0);
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="bgMusic" loop>
    <source src="homecoming-music.mpeg" type="audio/mpeg">
</audio>

<!-- COVER -->
<div class="cover" id="cover">
    <img src="Homecoming Cover.jpg" alt="Homecoming Cover">
    <div class="cover-text">Tap to Open Invitation</div>
</div>

<!-- CONTENT -->
<div class="container">

    <p class="fade">With gratitude and joy</p>

    <div class="divider fade"></div>

    <div class="names fade">
        Crishean <br>&amp;<br> Dinithi
    </div>

    <p class="fade">
        invite you to celebrate our homecoming
    </p>

    <div class="divider fade"></div>

    <h2 class="fade">Homecoming Celebration</h2>
    <p class="fade">
        Wednesday, 20th May 2026 <br>
        Evening Reception
    </p>

    <h2 class="fade">Venue</h2>
    <p class="fade">
        Your Reception Hall Name <br>
        Colombo
    </p>

    <div class="divider fade"></div>

    <h2 class="fade">Location</h2>

    <iframe 
        src="https://www.google.com/maps?q=Colombo&output=embed">
    </iframe>

    <p class="fade">
        <a href="#" target="_blank">
            View on Google Maps
        </a>
    </p>

    <p class="fade" style="margin-top:20px;">
        Your presence will complete our celebration
    </p>

</div>

<script>
const cover = document.getElementById('cover');
const music = document.getElementById('bgMusic');

cover.addEventListener('click', () => {
    cover.style.opacity = "0";

    setTimeout(() => {
        cover.style.display = "none";
        music.play().catch(() => {});
    }, 1200);
});

/* SCROLL ANIMATION */
const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
}, { threshold: 0.2 });

document.querySelectorAll('.fade').forEach(el => {
    observer.observe(el);
});
</script>

</body>
</html>
